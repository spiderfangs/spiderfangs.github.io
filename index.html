// ── Player logic ────────────────────────────────────────────────────
const VOL_KEY = 'biolink_vol'

function initPlayer() {
  const tracks = SITE.music.tracks
  let cur = SITE.music.defaultTrack
  let playing = false

  const audio = new Audio()
  window.__playerAudio = audio
  audio.src = tracks[cur].file
  audio.preload = 'metadata'

  const saved = parseFloat(localStorage.getItem(VOL_KEY) || '0.5')
  audio.volume = saved

  const $  = id => document.getElementById(id)
  const bp  = $('bp'), bs = $('bs'), bpl = $('bpl'), bn = $('bn')
  const vs  = $('vs'), ps = $('ps'), vf = $('vf'), pf = $('pf')
  const tc  = $('tc'), tt = $('tt')
  const tit = $('trk-title'), tlist = $('tlist')

  vs.value = saved
  vf.style.width = (saved * 100) + '%'

  const fmt = s => isFinite(s) ? `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}` : '0:00'

  function updateUI() {
    tit.textContent = tracks[cur].title
    tlist.querySelectorAll('.trk-item').forEach((el, i) => {
      el.classList.toggle('active', i === cur)
      const b = el.querySelector('.bars')
      if (i === cur && !b) { const d=document.createElement('div'); d.className='bars'; d.innerHTML='<span></span><span></span><span></span>'; el.appendChild(d) }
      else if (i !== cur && b) b.remove()
    })
  }

  function setIcon() { bpl.innerHTML = playing ? I.pause : I.play }

  function load(idx, ap) {
    cur = idx; audio.src = tracks[idx].file; audio.load(); updateUI()
    if (ap) audio.play().then(()=>{playing=true;setIcon()}).catch(()=>{})
  }

  async function toggle() {
    if (playing) audio.pause()
    else await audio.play().catch(()=>{})
  }

  audio.addEventListener('play',  () => { playing = true;  setIcon() })
  audio.addEventListener('pause', () => { playing = false; setIcon() })
  audio.addEventListener('ended', () => load((cur+1) % tracks.length, true))
  audio.addEventListener('loadedmetadata', () => { tt.textContent = fmt(audio.duration) })
  audio.addEventListener('timeupdate', () => {
    if (!audio.duration) return
    const p = audio.currentTime / audio.duration
    tc.textContent = fmt(audio.currentTime)
    ps.value = p; pf.style.width = (p*100)+'%'
  })

  bpl.addEventListener('click', async () => {
  if (ctx.state === 'suspended') await ctx.resume()
  toggle()
})
  bs.addEventListener('click', () => audio.pause())
  bp.addEventListener('click', () => load((cur-1+tracks.length)%tracks.length, playing))
  bn.addEventListener('click', () => load((cur+1)%tracks.length, playing))

  ps.addEventListener('input', () => { if(audio.duration) audio.currentTime=ps.value*audio.duration; pf.style.width=(ps.value*100)+'%' })
  vs.addEventListener('input', () => { const v=parseFloat(vs.value); audio.volume=v; vf.style.width=(v*100)+'%'; localStorage.setItem(VOL_KEY,v) })

  tlist.addEventListener('click', e => {
    const it = e.target.closest('.trk-item')
    if (!it) return
    const idx = parseInt(it.dataset.idx)
    if (idx === cur) toggle(); else load(idx, true)
  })

  document.addEventListener('keydown', e => {
    if (e.target !== document.body) return
    if (e.code === 'Space') { e.preventDefault(); toggle() }
    if (e.code === 'ArrowRight') load((cur+1)%tracks.length, playing)
    if (e.code === 'ArrowLeft')  load((cur-1+tracks.length)%tracks.length, playing)
    
  })
}

// ── Gallery logic ────────────────────────────────────────────────────
function initGallery() {
  const items = SITE.gallery.items
  let cur = 0, busy = false

  const img   = document.getElementById('gimg')
  const gnum  = document.getElementById('gnum')
  const gcap  = document.getElementById('gcap')
  const gdots = document.getElementById('gdots')
  const gprev = document.getElementById('gprev')
  const gnext = document.getElementById('gnext')

  function goTo(idx) {
    if (busy || idx === cur) return
    busy = true
    img.classList.add('fade'); gnum.classList.add('fade'); gcap.classList.add('fade')
    setTimeout(() => {
      cur = ((idx % items.length) + items.length) % items.length
      img.src = items[cur].image
      gnum.textContent = items[cur].number
      gcap.textContent = items[cur].caption
      gdots.querySelectorAll('.dot').forEach((d,i) => d.classList.toggle('active', i===cur))
      img.classList.remove('fade'); gnum.classList.remove('fade'); gcap.classList.remove('fade')
      busy = false
    }, 200)
  }

  gprev.addEventListener('click', () => goTo(cur-1))
  gnext.addEventListener('click', () => goTo(cur+1))
  gdots.addEventListener('click', e => { const d=e.target.closest('.dot'); if(d) goTo(parseInt(d.dataset.idx)) })
  setInterval(() => goTo(cur+1), 6000)
}

// ── Discord presence (Lanyard) ──────────────────────────────────────
console.log("Lanyard script running")

const ACT_TYPE_LABELS = { 0: 'Playing', 1: 'Streaming', 2: 'Listening to', 3: 'Watching' }
let _activityTimer = null

function resolveActivityImage(asset, appId) {
  if (!asset) return null
  if (asset.startsWith('spotify:')) return 'https://i.scdn.co/image/' + asset.slice(8)
  if (asset.startsWith('mp:'))      return 'https://media.discordapp.net/' + asset.slice(3)
  return `https://cdn.discordapp.com/app-assets/${appId}/${asset}.png`
}

function fmtElapsed(ms) {
  if (ms < 0) ms = 0
  const s = Math.floor(ms / 1000)
  const hh = Math.floor(s / 3600), mm = Math.floor((s % 3600) / 60), ss = s % 60
  const pad = n => String(n).padStart(2, '0')
  return hh > 0 ? `${hh}:${pad(mm)}:${pad(ss)}` : `${pad(mm)}:${pad(ss)}`
}

function escHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]))
}

function renderActivity(activity) {
  const host = document.getElementById('discord-activity')
  if (!host) return
  if (_activityTimer) { clearInterval(_activityTimer); _activityTimer = null }
  if (!activity) { host.innerHTML = ''; return }

  const label = ACT_TYPE_LABELS[activity.type] || 'activity'
  const imgSrc = activity.assets && activity.assets.large_image
    ? resolveActivityImage(activity.assets.large_image, activity.application_id)
    : null
  const smallImgSrc = activity.assets && activity.assets.small_image
    ? resolveActivityImage(activity.assets.small_image, activity.application_id)
    : null
  const start = activity.timestamps && activity.timestamps.start

  host.innerHTML = `
    <div class="section-lbl">${escHtml(label)}</div>
    <div class="status-box" style="align-items:flex-start;padding:11px 12px">
      ${imgSrc ? `
        <div class="act-art">
          <img src="${imgSrc}" alt="" onerror="this.parentElement.style.display='none'" />
          ${smallImgSrc ? `<img class="act-art-sm" src="${smallImgSrc}" alt="" onerror="this.remove()" />` : ''}
        </div>` : ''}
      <div class="s-info" style="min-width:0;flex:1">
        <div class="s-name" style="font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${escHtml(activity.name || '')}</div>
        ${activity.details ? `<div class="s-handle" style="white-space:normal;font-size:9.5px;color:var(--soft);margin-top:3px">${escHtml(activity.details)}</div>` : ''}
        ${activity.state ? `<div class="s-handle" style="white-space:normal;font-size:9.5px;margin-top:2px">${escHtml(activity.state)}</div>` : ''}
        ${start ? `<div class="s-handle" id="act-elapsed" style="margin-top:4px">${fmtElapsed(Date.now() - start)} elapsed</div>` : ''}
      </div>
    </div>
  `

  if (start) {
    const el = host.querySelector('#act-elapsed')
    _activityTimer = setInterval(() => {
      if (el && el.isConnected) el.textContent = fmtElapsed(Date.now() - start) + ' elapsed'
      else { clearInterval(_activityTimer); _activityTimer = null }
    }, 1000)
  }
}

async function fetchDiscordPresence() {
  console.log("Fetching Discord presence...")
  const id = SITE.user.discordUserId
  if (!id) return
  try {
    const res = await fetch(`https://api.lanyard.rest/v1/users/${id}`)
    const data = await res.json()
    console.log("Response:", data)
    console.log("Activities:", data.data && data.data.activities)
    if (!data || !data.success || !data.data) return

    const d = data.data
    const statusKey = d.discord_status || 'offline'

    const dot = document.querySelector('.status-box .s-dot')
    if (dot) {
      dot.classList.remove('s-online', 's-idle', 's-dnd', 's-offline')
      dot.classList.add('s-' + statusKey)
    }
    const statusText = document.querySelector('.status-box .s-status-text')
    if (statusText) {
      statusText.classList.remove('s-online', 's-idle', 's-dnd', 's-offline')
      statusText.classList.add('s-status-text', 's-' + statusKey)
      statusText.textContent = statusKey
    }

    const u = d.discord_user || {}
    const displayName = u.global_name || u.username
    const sName = document.querySelector('.status-box .s-name')
    const sHandle = document.querySelector('.status-box .s-handle')
    if (sName && displayName) sName.textContent = displayName
    if (sHandle && u.username) sHandle.textContent = '@' + u.username

    const clan = u.clan || u.primary_guild
    const nameRow = document.querySelector('.status-box .s-name-row')
    if (nameRow) {
      const existing = nameRow.querySelector('.s-clan')
      if (existing) existing.remove()
      if (clan && clan.tag && clan.identity_enabled !== false) {
        const badgeUrl = clan.badge && clan.identity_guild_id
          ? `https://cdn.discordapp.com/clan-badges/${clan.identity_guild_id}/${clan.badge}.png?size=16`
          : null
        const tagEl = document.createElement('span')
        tagEl.className = 's-clan'
        tagEl.innerHTML = `${badgeUrl ? `<img src="${badgeUrl}" alt="" onerror="this.remove()" />` : ''}<span>${escHtml(clan.tag)}</span>`
        nameRow.appendChild(tagEl)
      }
    }

    const avatarUrl = u.id && u.avatar
      ? `https://cdn.discordapp.com/avatars/${u.id}/${u.avatar}.png?size=128`
      : null
    const discAv = document.querySelector('.status-box .disc-av')
    if (discAv && avatarUrl) {
      let img = discAv.querySelector('img.disc-avatar')
      if (!img) {
        const svg = discAv.querySelector('svg')
        if (svg) svg.remove()
        img = document.createElement('img')
        img.className = 'disc-avatar'
        img.alt = displayName || ''
        img.onerror = function () { this.remove() }
        discAv.appendChild(img)
      }
      if (img.src !== avatarUrl) img.src = avatarUrl
    }

    const activity = (d.activities || []).find(a => a.type !== 4)
    renderActivity(activity)
  } catch (err) {
    console.log("Lanyard fetch failed", err)
  }
}

document.addEventListener("DOMContentLoaded", () => {
  fetchDiscordPresence()
  setInterval(fetchDiscordPresence, 15000)
})

  let dismissed = false
const dismiss = () => {
  if (dismissed) return
  dismissed = true
  ov.classList.add('hide')

  // 🎵 START MUSIC HERE
  const audioEl = window.__playerAudio
  if (audioEl) {
    audioEl.play().catch(() => {})
  }

  setTimeout(() => { ov.remove() }, 1150)
}
  ov.addEventListener('click', dismiss, { once: true })
  setTimeout(dismiss, 1800)
})()
